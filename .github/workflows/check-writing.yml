name: Check Writing

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-writing-changed.sh"
      - ".github/workflows/check-writing.yml"

jobs:
  check-writing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check writing guide compliance
        env:
          DOCS_BASE_REF: origin/${{ github.base_ref }}
        run: bash scripts/check-writing-changed.sh
